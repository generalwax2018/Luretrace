{% macro pill(text, css) %}<span class="pill {{ css }}">{{ text }}</span>{% endmacro %}

{% macro verdict_pill(label) -%}
{{ pill(label|capitalize, {'malicious':'bad','suspicious':'warn','clean':'ok','skipped':'neutral'}.get(label,'neutral')) }}
{%- endmacro %}

{% macro icon(name, size=18, sw=1.7) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{ sw }}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'hook' %}<path d="M12 3v9a4 4 0 1 1-4-4"></path><circle cx="12" cy="3" r="1.4"></circle>
{%- elif name == 'shield' %}<path d="M12 3l7 3v5c0 4.5-3 8.2-7 9.5C8 19.2 5 15.5 5 11V6z"></path><path d="M9 12l2 2 4-4"></path>
{%- elif name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
{%- elif name == 'list' %}<path d="M8 6h13M8 12h13M8 18h13"></path><path d="M3 6h.01M3 12h.01M3 18h.01"></path>
{%- elif name == 'flag' %}<path d="M4 22V4"></path><path d="M4 4h12l-2 4 2 4H4"></path>
{%- elif name == 'check' %}<rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 12l3 3 7-7"></path>
{%- elif name == 'alert' %}<path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path>
{%- elif name == 'inbox' %}<path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"></path>
{%- elif name == 'link' %}<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"></path>
{%- elif name == 'download' %}<path d="M12 4v12"></path><polyline points="7 11 12 16 17 11"></polyline><path d="M4 18v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1"></path>
{%- elif name == 'image' %}<rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="M21 16l-5-5L5 20"></path>
{%- elif name == 'arrow' %}<path d="M5 12h14"></path><polyline points="13 6 19 12 13 18"></polyline>
{%- elif name == 'skull' %}<path d="M12 3a8 8 0 0 0-5 14v2a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-2a8 8 0 0 0-5-14z"></path><circle cx="9" cy="12" r="1.3"></circle><circle cx="15" cy="12" r="1.3"></circle>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
{%- endif %}</svg>
{%- endmacro %}
