{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Scan not found</h1><p class="lede tight">No scan with id <span class="mono">{{ scan_id }}</span> under the configured scans directory.</p></div></div>

{% endblock %}
