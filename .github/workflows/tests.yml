name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # web + attachments so the gate/console and QR tests run instead of skipping.
      - name: Install package
        run: pip install -e ".[dev,web,attachments]"

      - name: Lint
        run: ruff check .

      - name: Install Chromium for the detonation tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: pytest -q
